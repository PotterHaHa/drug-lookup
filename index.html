<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128138;</text></svg>">
<style>html{color-scheme:light dark}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>人人藥品效期與銷售查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#7b8c99;
  --line:#d8dfe4; --line-strong:#b9c5cd;
  --accent:#0f6e6e; --accent-soft:#dcecec;
  --violet:#5a4b8c; --violet-soft:#e8e4f2;
  --ok:#2e7d4f; --ok-soft:#e2f0e8;
  --warn:#a35a00; --warn-soft:#faeddc;
  --danger:#b3261e; --danger-soft:#fae4e2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1417; --surface:#151f25; --surface-2:#1b262d;
    --ink:#e4ebef; --ink-2:#a3b3bd; --ink-3:#7a8b96;
    --line:#26343d; --line-strong:#3a4c57;
    --accent:#4fc0bb; --accent-soft:#16332f;
    --violet:#a99ad6; --violet-soft:#241f38;
    --ok:#68c68c; --ok-soft:#14301f;
    --warn:#e0a95c; --warn-soft:#33270f;
    --danger:#f08a80; --danger-soft:#361714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1417; --surface:#151f25; --surface-2:#1b262d;
  --ink:#e4ebef; --ink-2:#a3b3bd; --ink-3:#7a8b96;
  --line:#26343d; --line-strong:#3a4c57;
  --accent:#4fc0bb; --accent-soft:#16332f;
  --violet:#a99ad6; --violet-soft:#241f38;
  --ok:#68c68c; --ok-soft:#14301f;
  --warn:#e0a95c; --warn-soft:#33270f;
  --danger:#f08a80; --danger-soft:#361714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px;padding-block:26px 64px}

/* 密碼鎖 */
body.locked .wrap{display:none}
#gate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:var(--ground)}
body.locked #gate{display:flex}
.gatecard{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px;text-align:center}
.gatecard .mark{font-size:30px;line-height:1}
.gatecard h2{margin:12px 0 4px;font-size:18px;font-weight:700}
.gatecard p.hint{margin:0 0 18px;font-size:13px;color:var(--ink-3)}
#pw{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:11px 13px;font:500 17px/1.3 "IBM Plex Mono",monospace;text-align:center;letter-spacing:.2em}
#pw:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#enter{width:100%;margin-top:10px;border:0;border-radius:9px;cursor:pointer;background:var(--accent);color:var(--ground);font:600 15px/1 "IBM Plex Sans","Noto Sans TC",sans-serif;padding:12px}
#enter[disabled]{opacity:.6;cursor:progress}
#gate-err{margin:12px 0 0;font-size:13px;color:var(--danger);min-height:1.2em}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--ink-3);font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;font:600 14.5px/1 "IBM Plex Sans","Noto Sans TC",sans-serif;padding:11px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;opacity:.7;margin-left:5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.searchbar{position:sticky;top:0;z-index:20;padding-block:8px 10px;background:var(--ground)}
.searchbox{display:flex;align-items:center;gap:10px;padding:10px 14px}
.searchbox svg{flex:none;color:var(--ink-3)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16.5px/1.4 "IBM Plex Sans","Noto Sans TC",sans-serif;outline:none}
.searchbox input::placeholder{color:var(--ink-3);font-weight:400}
.clear{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.clear:hover{background:var(--surface-2);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chipbtn:hover{border-color:var(--line-strong)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.chipbtn .n{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.75}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:500 13px/1.3 "IBM Plex Sans","Noto Sans TC",sans-serif;cursor:pointer;max-width:190px}
.chipbtn:focus-visible,.searchbox input:focus-visible,.clear:focus-visible,.row:focus-visible,select:focus-visible,nav.tabs button:focus-visible,#more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.count{margin:16px 2px 8px;font-size:13px;color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:8px}
.view{display:none}
.view.on{display:block}

.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px 16px;cursor:pointer;grid-template-columns:1fr auto;align-items:start}
.row:hover{border-color:var(--line-strong)}
.row.open{border-color:var(--accent)}
.r-code{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r-name{font-weight:600;font-size:15.5px;margin-top:1px;overflow-wrap:anywhere}
.r-meta{color:var(--ink-2);font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.r-meta b{font-weight:500;color:var(--ink)}
.r-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.exp{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.none{background:var(--surface-2);color:var(--ink-3);font-weight:500}
.tag.info{background:var(--violet-soft);color:var(--violet)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.sm{font-size:10.5px;padding:1px 6px;letter-spacing:.02em}

.detail{grid-column:1/-1;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:none}
.row.open .detail{display:block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px}
.f{display:flex;flex-direction:column;gap:2px}
.f .k{font-size:11px;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.f .v{font-size:14px;overflow-wrap:anywhere}
.sect{margin-top:16px}
.sect h4{margin:0 0 6px;font-size:11px;letter-spacing:.07em;color:var(--ink-3)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:5px 12px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;padding-right:14px}
.tscroll{overflow-x:auto}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);line-height:1.75}

/* 20 個月的格子 */
.mm{display:inline-flex;gap:1.5px;align-items:center;height:18px}
.mm i{width:7px;height:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;display:block}
.mm i.on{background:var(--accent);border-color:var(--accent)}
.mm i.y2{margin-left:5px}
.mmkey{font-size:10.5px;color:var(--ink-3);margin-left:8px;white-space:nowrap}

/* 品項區塊 */
.item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:8px;background:var(--surface-2)}
.item-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.item-t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;flex:1 1 240px}
.item-c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-weight:400;display:block;margin-top:1px}
.item-row2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px 14px;margin-top:10px}
.kv .k{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.kv .v{font-size:13.5px;overflow-wrap:anywhere}
.kv .v.hl{color:var(--accent);font-weight:600}
.hist{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.hist h5{margin:0 0 5px;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.hist table{font-size:13px}
.hist th{padding-top:0}
.packnote{font-size:12px;color:var(--ink-3);margin-top:8px}
.packnote b{color:var(--ink-2);font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:8px 22px;margin:10px 2px 0;font-size:13px;color:var(--ink-2)}
.totals b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
#more{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:11px;font:600 14px/1 "IBM Plex Sans","Noto Sans TC",sans-serif;cursor:pointer}
#more:hover{border-color:var(--line-strong);color:var(--ink)}

@media (max-width:760px){
  .tscroll{overflow-x:visible}
  .rtable{display:block}
  .rtable thead{display:none}
  .rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:9px 12px;margin-bottom:8px}
  .rtable tr:last-child{margin-bottom:0}
  .rtable td{border:0;padding:3px 0;display:flex;gap:14px;justify-content:space-between;align-items:baseline;text-align:right;min-width:0 !important;overflow-wrap:anywhere}
  .rtable td::before{content:attr(data-k);flex:none;text-align:left;color:var(--ink-3);font-size:11px;letter-spacing:.06em;font-weight:600;white-space:nowrap}
  .rtable td.lead{display:block;text-align:left;font-weight:600;font-size:14.5px;padding-bottom:7px;margin-bottom:5px;border-bottom:1px solid var(--line);white-space:normal !important}
  .rtable td.lead::before{display:none}
  .rtable td.lead+td.lead{padding-top:0;margin-top:-4px;font-weight:500;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
  .rtable td.num{padding-right:0}
  .rtable td:empty{display:none}
  .rtable td[data-k]{white-space:normal !important}
  #l-det{padding:0 !important;background:transparent;border:0;box-shadow:none}
}
@media (max-width:600px){
  .row{grid-template-columns:1fr}
  .r-right{align-items:center;text-align:left;flex-direction:row;gap:10px;margin-top:6px}
  select{max-width:46%}
}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .12s ease}}
</style>
</head>
<body class="locked">


<div id="gate">
  <form class="gatecard" id="gateform">
    <div class="mark">&#128274;</div>
    <h2>人人藥品資料查詢</h2>
    <p class="hint">資料已加密，請輸入密碼解鎖</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="密碼">
    <button id="enter" type="submit">解密進入</button>
    <p id="gate-err" role="alert"></p>
  </form>
</div>

<div class="wrap">
  <header class="top">
    <h1>人人藥品資料查詢</h1>
    <span class="sub" id="hmeta"></span>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="view" id="v-prod">
    <div class="searchbar">
      <div class="panel searchbox">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18" stroke-linecap="round"/></svg>
        <input id="q-prod" type="search" placeholder="品名、SAP 代號、英文名、健保碼、批次號…" autocomplete="off" spellcheck="false">
        <button class="clear" type="button" data-clear="q-prod" hidden>&times;</button>
      </div>
      <div class="filters" id="f-prod"></div>
    </div>
    <p class="count" id="c-prod"></p>
    <div class="list" id="l-prod"></div>
  </section>

  <section class="view" id="v-cust">
    <div class="searchbar">
      <div class="panel searchbox">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18" stroke-linecap="round"/></svg>
        <input id="q-cust" type="search" placeholder="客戶名稱、機構代號、業務員、藥品…" autocomplete="off" spellcheck="false">
        <button class="clear" type="button" data-clear="q-cust" hidden>&times;</button>
      </div>
      <div class="filters" id="f-cust"></div>
    </div>
    <p class="count" id="c-cust"></p>
    <div class="list" id="l-cust"></div>
  </section>

  <section class="view on" id="v-quote">
    <div class="searchbar">
      <div class="panel" style="padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center">
        <label for="q-cust-sel" style="font-size:13px;color:var(--ink-3);font-weight:600">報價對象</label>
        <input id="q-cust-sel" list="custlist" placeholder="輸入客戶名稱（可留空）" autocomplete="off"
               style="flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:8px 11px;font:500 14px/1.3 'IBM Plex Sans','Noto Sans TC',sans-serif">
        <datalist id="custlist"></datalist>
        <span id="q-cust-note" style="font-size:12.5px;color:var(--ink-3)"></span>
      </div>
      <div class="panel searchbox" style="margin-top:8px">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18" stroke-linecap="round"/></svg>
        <input id="q-quote" type="search" placeholder="搜尋品名或規格，例如「倍克健 20」「口得安」…" autocomplete="off" spellcheck="false">
        <button class="clear" type="button" data-clear="q-quote" hidden>&times;</button>
      </div>
      <div class="filters" id="f-quote"></div>
    </div>
    <div id="cart" class="panel" style="margin-top:14px;padding:14px" hidden></div>
    <p class="count" id="c-quote"></p>
    <div class="list" id="l-quote"></div>
  </section>

  <section class="view" id="v-det">
    <div class="searchbar">
      <div class="panel searchbox">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18" stroke-linecap="round"/></svg>
        <input id="q-det" type="search" placeholder="搜尋客戶、品項、代號、業務員…" autocomplete="off" spellcheck="false">
        <button class="clear" type="button" data-clear="q-det" hidden>&times;</button>
      </div>
      <div class="filters" id="f-det"></div>
      <div class="totals" id="t-det"></div>
    </div>
    <div class="panel tscroll" id="l-det" style="margin-top:14px;padding:4px 14px 10px"></div>
    <button id="more" type="button" hidden></button>
  </section>

<script>
/* ---------- 解密 ---------- */
const KEY='rr-db-pw';
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decrypt(pw){
  const raw = b64d(document.getElementById('blob').textContent.trim());
  const salt = raw.slice(0,16), iv = raw.slice(16,28), body = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, body);
  let bytes = new Uint8Array(plain);
  if(typeof DecompressionStream === 'function'){
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

let custReady=0, prodReady=0, detReady=0;
let DB, PROD, CUST, DET, META, MONTHS, PMAP={}, PL=[], BYSAP={}, CMAP={}, OOS={items:[],nocode:[],asOf:''};
const gate=document.getElementById('gateform'), pwEl=document.getElementById('pw'),
      errEl=document.getElementById('gate-err'), btn=document.getElementById('enter');
document.body.classList.add('locked');
setTimeout(()=>pwEl.focus(),60);
gate.addEventListener('submit', async e=>{
  e.preventDefault();
  btn.disabled=true; errEl.style.color='var(--ink-3)'; errEl.textContent='解密中…';
  try{
    DB = await decrypt(pwEl.value);
    try{ sessionStorage.setItem(KEY, pwEl.value); }catch(_){}
    errEl.textContent=''; start();
  }catch(err){
    errEl.style.color='var(--danger)';
    errEl.textContent = String(err).includes('DecompressionStream') ? '瀏覽器版本過舊，請更新後再試。' : '密碼不正確，請再試一次。';
    pwEl.value=''; pwEl.focus();
  }
  btn.disabled=false;
});
(async ()=>{
  let saved=null; try{ saved=sessionStorage.getItem(KEY); }catch(_){}
  if(saved){ try{ DB=await decrypt(saved); start(); }catch(_){} }
})();

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = v => (v===null||v===undefined||v==='') ? '—' : esc(v);
const n0 = v => (v===null||v===undefined||v==='') ? '—' : Math.round(v).toLocaleString('en-US');
const n1 = v => (v===null||v===undefined||v==='') ? '—' : (Math.round(v*10)/10).toLocaleString('en-US');
const money = n0;
const p2 = v => (v===null||v===undefined||v==='') ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const days = iso => Math.round((new Date(iso+'T00:00:00') - TODAY)/86400000);
function expStatus(d){
  if(d===null) return {k:'none',label:'無效期資料',cls:'none'};
  if(d<0) return {k:'expired',label:'已過期',cls:'danger'};
  if(d<=180) return {k:'soon',label:'剩 '+d+' 天',cls:'danger'};
  if(d<=365) return {k:'year',label:'剩 '+Math.round(d/30)+' 個月',cls:'warn'};
  return {k:'ok',label:'剩 '+(d/365).toFixed(1)+' 年',cls:'ok'};
}
function monthCells(mat){
  return '<span class="mm">'+mat.map((v,i)=>
    '<i class="'+(v?'on':'')+(i===12?' y2':'')+'" title="'+MONTHS[i]+' '+(v?n0(v):'未採購')+'"></i>').join('')
    +'</span><span class="mmkey">2025 ｜ 2026</span>';
}
function chipGroup(box, defs, getActive, setActive){
  box.innerHTML='';
  defs.forEach(d=>{
    const b=document.createElement('button');
    b.className='chipbtn'; b.type='button';
    b.setAttribute('aria-pressed', d.k===getActive());
    b.innerHTML=d.label+(d.n!==undefined?' <span class="n">'+d.n+'</span>':'');
    b.onclick=()=>{ setActive(d.k); [...box.children].forEach(c=>{ if(c.tagName==='BUTTON'&&c.classList.contains('chipbtn')) c.setAttribute('aria-pressed',c===b); }); };
    box.appendChild(b);
  });
}
function wireSearch(id, fn){
  const i=document.getElementById(id), c=document.querySelector('[data-clear="'+id+'"]');
  let timer=null, composing=false;
  const fire=()=>{ clearTimeout(timer); timer=setTimeout(()=>fn(i.value.trim().toLowerCase()), 180); };
  c.onclick=()=>{ i.value=''; c.hidden=true; clearTimeout(timer); fn(''); i.focus(); };
  // 注音／中文輸入法組字期間完全不重算，組完字才跑一次
  i.addEventListener('compositionstart',()=>{ composing=true; clearTimeout(timer); });
  i.addEventListener('compositionend',()=>{ composing=false; c.hidden=!i.value; fire(); });
  i.addEventListener('input',()=>{ c.hidden=!i.value; if(!composing) fire(); });
}


/* ---------- 啟動 ---------- */
function start(){
  PROD=DB.products; CUST=DB.customers; DET=DB.detail; META=DB.meta; MONTHS=META.months; PL=DB.pricelist||[]; OOS=DB.oos||{items:[],nocode:[],asOf:''};
  document.body.classList.remove('locked');

  document.getElementById('hmeta').textContent =
    META.scope + ' · 銷售 ' + MONTHS[0] + ' ~ ' + META.last + ' · 效期 ' + TODAY.toISOString().slice(0,10) + ' 起算 · ' + META.pl.group + '牌價 ' + META.pl.version;
  document.getElementById('foot').innerHTML =
    '資料來源：GP 含藥品公司銷售資料 0831（Data 分頁，已篩選為 ' + esc(META.scope) + '）、G4人人產品效期、人人產品包裝下單最小單位、0903 指定客戶名單。<br>'
    + '原始資料只有「年／月」沒有日期，週期一律以月為單位；月均用量＝總數量÷' + MONTHS.length + ' 個月；距末購以 ' + META.last + ' 為基準；預估下次採購＝末購月＋平均間隔，僅供參考。<br>'
    + '報價規則：① 該客戶自己叫過 → 用他自己的成交價；② 沒叫過 → 用'+META.pl.group+'牌價的<b>最高價</b>（版本 '+META.pl.version+'）。其他客戶的成交價僅列為議價參考，不作報價依據。'+ '報價表 '+META.pl.n+' 項中，'+META.pl.auto+' 項已對到料號、'+META.pl.review+' 項待人工確認、'+META.pl.none+' 項資料庫查無。<br>'+ '缺貨標記依 '+OOS.asOf+' 倉庫布達（'+OOS.items.length+' 個料號，無交期）；另有 '+OOS.nocode.length+' 項自費 P 版缺貨但資料庫無對應料號：'+OOS.nocode.join('、')+'。<br>'+ '負數金額為退貨或折讓。' + META.noSap + ' 筆交易在原始檔沒有 SAP 料號，' + META.orphan.length + ' 個料號不在效期表中，這些在產品頁看不到，但客戶頁與明細頁完整保留。';

  PROD.forEach(p=>{
    p.dmin = p.batches.length ? Math.min(...p.batches.map(b=>days(b.exp))) : null;
    p.st = expStatus(p.dmin);
    p.nearest = p.batches.length ? p.batches.slice().sort((a,b)=>a.exp<b.exp?-1:1)[0] : null;
    p.hay = [p.code,p.name,p.en,p.nhi,p.pack,p.sales&&p.sales.icode,
             ...(p.sales?p.sales.custs.map(c=>c.name):[]), ...p.batches.map(b=>b.batch)]
            .filter(Boolean).join(' ').toLowerCase();
  });
  PMAP={}; PROD.forEach(p=>{ PMAP[p.code]=p; });
  CMAP={}; CUST.forEach(c=>{ CMAP[c.name]=c; });
  BYSAP={}; DET.forEach(d=>{ if(d.sap) (BYSAP[d.sap]=BYSAP[d.sap]||[]).push(d); });
  CUST.forEach(c=>{
    c.hay=[c.name,c.inst,c.instCode,c.custCode,c.custName,c.city,c.dist,c.zip,c.ctype,
           ...(c.reps||[]), ...c.cycles.map(x=>x.item+' '+x.icode+' '+(x.sap||''))]
          .filter(Boolean).join(' ').toLowerCase();
  });
  DET.forEach(d=>{
    d.hay=[d.cust,d.item,d.sapName,d.icode,d.sap,d.rep,d.city,d.dist,d.instCode,d.custCode,d.cat,d.ym,d.brand]
          .filter(Boolean).join(' ').toLowerCase();
  });

  buildTabs(); initQuote(); initProd(); initCust(); initDet();
}

function buildTabs(){
  const TABS=[{k:'quote',label:'報價',n:PL.length},{k:'prod',label:'產品效期',n:PROD.length},{k:'cust',label:'客戶用藥週期',n:CUST.length},{k:'det',label:'交易明細',n:DET.length}];
  const box=document.getElementById('tabs'); box.innerHTML='';
  let cur='quote';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected',t.k===cur);
    b.innerHTML=t.label+'<span class="n">'+t.n.toLocaleString('en-US')+'</span>';
    b.onclick=()=>{ cur=t.k; [...box.children].forEach(c=>c.setAttribute('aria-selected',c===b));
      TABS.forEach(x=>document.getElementById('v-'+x.k).classList.toggle('on',x.k===cur));
      if(cur==='cust'&&!custReady){ custReady=1; renderCust(); }
      if(cur==='prod'&&!prodReady){ prodReady=1; renderProd(); }
      if(cur==='det'&&!detReady){ detReady=1; renderDet(); } };
    box.appendChild(b);
  });
}

/* ---------- 報價 ---------- */
const PAGE0=40;
let qQ='', qCust='', CART=[], qActive='all', qShown=PAGE0;
function quoteFor(sap, custName){
  // ① 該客戶自己叫過 → 用他自己的成交價；② 沒叫過 → 診所組牌價「最高價」
  const rs=(BYSAP[sap]||[]);
  const own=custName?rs.filter(d=>d.cust===custName && d.qty).sort((a,b)=>b.ym.localeCompare(a.ym)):[];
  const others=rs.filter(d=>d.qty && d.cust!==custName).sort((a,b)=>b.ym.localeCompare(a.ym));
  const ref = others.length ? {price:Math.round(others[0].amt/others[0].qty*100)/100,
                               src:others[0].cust+' '+others[0].ym, n:others.length} : null;
  if(own.length) return {tier:1, price:Math.round(own[0].amt/own[0].qty*100)/100,
    src:'本客戶 '+own[0].ym+'（'+n0(own[0].qty)+'）', n:own.length, ref:ref};
  return {tier:0, price:null, ref:ref};
}
function quoteRow(i){
  const L=PL[i], p=L.sap?PMAP[L.sap]:null;
  const q=L.sap?quoteFor(L.sap,qCust):{tier:0,price:null,ref:null};
  const listTxt = L.range ? (L.lo!==null&&L.lo===L.hi?p2(L.lo):L.range) : '—';
  const hi = (L.hi===null||L.hi===undefined)?null:L.hi;
  const price = q.tier===1 ? q.price : hi;
  const tier = q.tier===1 ? 1 : (hi!==null?2:0);
  const tierTag = tier===1?'<span class="tag ok">本客戶成交價</span>'

function initQuote(){
  document.getElementById('custlist').innerHTML =
    CUST.slice().sort((a,b)=>b.amt-a.amt).map(c=>'<option value="'+esc(c.name)+'">').join('');
  const ci=document.getElementById('q-cust-sel');
  ci.addEventListener('input',()=>{
    qCust = CMAP[ci.value] ? ci.value : '';
    const c=CMAP[qCust];
    document.getElementById('q-cust-note').textContent = c
      ? (c.city||'經銷／公司戶')+(c.dist||'')+'　'+(c.ctype||'')+'　買過 '+c.items+' 項　距末購 '+c.since+' 個月'
      : (ci.value?'查無此客戶，將以他家成交價／牌價報':'未指定客戶，將以他家成交價／牌價報');
    renderQuote(); renderCart();
  });
  const F=[{k:'all',label:'全部',n:PL.length},
           {k:'mine',label:'本客戶買過'},
           {k:'sold',label:'資料庫有成交',n:PL.filter(x=>x.sap&&(BYSAP[x.sap]||[]).length).length},
           {k:'nodata',label:'無成交紀錄',n:PL.filter(x=>!x.sap||!(BYSAP[x.sap]||[]).length).length},
           {k:'oos',label:'目前缺貨',n:PL.filter(x=>x.sap&&PMAP[x.sap]&&PMAP[x.sap].oos).length},
           {k:'instock',label:'排除缺貨'},
           {k:'review',label:'對碼待確認',n:PL.filter(x=>x.conf!=='auto').length}];
  chipGroup(document.getElementById('f-quote'),F,()=>qActive,k=>{qActive=k;qShown=PAGE0;renderQuote();});
  wireSearch('q-quote',v=>{qQ=v;qShown=PAGE0;renderQuote();});
  document.getElementById('l-quote').addEventListener('click',e=>{
    const btn=e.target.closest('[data-add]');
    if(btn){ e.stopPropagation(); const i=+btn.dataset.add;
      const k=CART.indexOf(i); if(k<0) CART.push(i); else CART.splice(k,1);
      renderCart(); renderQuote(); return; }
    const r=e.target.closest('.row'); if(r) toggleRow(r);
  });
  renderQuote(); renderCart();
}
function renderQuote(){
  const rows=PL.map((x,i)=>i).filter(i=>{
    const L=PL[i];
    if(qQ && !((L.name+' '+L.spec+' '+(L.cat||'')+' '+(L.ing||'')+' '+(L.sap||'')).toLowerCase().includes(qQ))) return false;
    const has=L.sap&&(BYSAP[L.sap]||[]).length;
    if(qActive==='sold') return !!has;
    if(qActive==='nodata') return !has;
    if(qActive==='review') return L.conf!=='auto';
    if(qActive==='oos') return !!(L.sap&&PMAP[L.sap]&&PMAP[L.sap].oos);
    if(qActive==='instock') return !(L.sap&&PMAP[L.sap]&&PMAP[L.sap].oos);
    if(qActive==='mine') return !!(qCust && L.sap && (BYSAP[L.sap]||[]).some(d=>d.cust===qCust));
    return true;
  });
  const shownQ=rows.slice(0,qShown);
  document.getElementById('c-quote').textContent='顯示 '+shownQ.length+' / '+rows.length+' 個報價表品項'+(qCust?'（報價對象：'+qCust+'）':'');
  document.getElementById('l-quote').innerHTML = rows.length?shownQ.map(quoteRow).join('')
    +(rows.length>qShown?'<button class="chipbtn" type="button" id="quote-more" style="margin-top:6px;justify-content:center">顯示更多（還有 '+(rows.length-qShown)+' 項）</button>':'')
    :'<div class="panel empty">找不到符合條件的品項。</div>';
}
function renderCart(){
  const box=document.getElementById('cart');
  box.hidden = !CART.length;
  if(!CART.length) return;
  const lines=CART.map(i=>{
    const L=PL[i], p=L.sap?PMAP[L.sap]:null, q=L.sap?quoteFor(L.sap,qCust):{tier:0};
    const price=(q.tier===1)?q.price:((L.hi===null||L.hi===undefined)?null:L.hi);
    const b=p&&p.nearest;
    return {L:L,p:p,q:q,price:price,b:b,
      txt:'・'+L.name+' '+L.spec+'　'+(price==null?'報價需確認':p2(price)+' 元/'+(L.unit||'支'))
          +(p&&p.moq?'　最小下單 '+n0(p.moq):'')
          +(b?'　效期 '+b.exp:'　效期待確認')
          +(p&&p.oos?'　★目前缺貨':'')};
  });
  const head=(qCust?qCust+' 報價':'報價單')+'\n（依 '+MONTHS[0]+'~'+META.last+' 成交紀錄，牌價版本 '+META.pl.version+'）\n\n';
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<b style="font-size:14px">報價單（'+CART.length+' 項）</b>'
    +'<button class="chipbtn" type="button" id="cart-clear">清空</button></div>'
    +'<div class="tscroll" style="margin-top:8px"><table class="rtable"><thead><tr><th>品項</th><th class="num">報價</th><th>依據</th><th class="num">最小下單</th><th>效期</th><th>供貨</th></tr></thead><tbody>'
    + lines.map(x=>'<tr><td class="lead">'+esc(x.L.name)+' '+esc(x.L.spec)+'</td>'
      +'<td class="num mono" data-k="報價">'+(x.price==null?'—':p2(x.price))+'</td>'
      +'<td data-k="依據">'+(x.q&&x.q.tier===1?'本客戶成交價':'牌價最高')+'</td>'
      +'<td class="num mono" data-k="最小下單">'+(x.p&&x.p.moq?n0(x.p.moq):'—')+'</td>'
      +'<td class="mono" data-k="效期">'+(x.b?esc(x.b.exp):'—')+'</td>'
      +'<td data-k="供貨">'+(x.p&&x.p.oos?'<span class="tag danger sm">缺貨</span>':'—')+'</td></tr>').join('')
    +'</tbody></table></div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px">'
      +'<button class="chipbtn" type="button" id="cart-copy" style="background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:600;padding:9px 18px">複製全部</button>'
      +'<button class="chipbtn" type="button" id="cart-share" hidden style="padding:9px 16px">分享到 LINE…</button>'
      +'<span id="cart-msg" style="font-size:12.5px;color:var(--ok);font-weight:600"></span>'
    +'</div>'
    +'<textarea id="cart-txt" readonly rows="'+Math.min(16,CART.length+4)+'" style="width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:10px;font:400 13px/1.7 \'IBM Plex Mono\',monospace;resize:vertical"></textarea>';
  const text = head + lines.map(x=>x.txt).join('\n');
  const ta=document.getElementById('cart-txt');
  ta.value = text;
  ta.onclick=function(){ this.select(); };
  document.getElementById('cart-clear').onclick=function(){CART=[];renderCart();renderQuote();};

  const msg=document.getElementById('cart-msg');
  function flash(t,bad){ msg.textContent=t; msg.style.color=bad?'var(--danger)':'var(--ok)';
    clearTimeout(flash.t); flash.t=setTimeout(function(){msg.textContent='';},2500); }
  document.getElementById('cart-copy').onclick=async function(){
    try{
      if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
      else {
        ta.removeAttribute('readonly');
        ta.focus(); ta.setSelectionRange(0, ta.value.length);
        const ok=document.execCommand('copy');
        ta.setAttribute('readonly','');
        if(!ok) throw new Error('copy failed');
      }
      flash('✓ 已複製，可以直接貼到 LINE');
    }catch(err){
      ta.focus(); ta.select();
      flash('無法自動複製，已幫你全選，長按選「複製」', true);
    }
  };
  const share=document.getElementById('cart-share');
  if(navigator.share){
    share.hidden=false;
    share.onclick=async function(){ try{ await navigator.share({text:text}); }catch(_){} };
  }
}

function comboText(hist){

    .map(([q,n])=>n0(+q)+(n>1?' ×'+n+' 次':''))
    .join('、') || '—';
}

   +'<div class="item-h"><div class="item-t">'+esc(x.item)
     +'<span class="item-c">'+val(x.icode)+(x.sap?' → '+esc(x.sap):'')+(x.cat?' · '+esc(x.cat):'')+'</span></div>'
     +'<span>'+(p&&p.oos?'<span class="tag danger" style="margin-right:6px">缺貨</span>':'')
     +'<span class="tag '+cls+'">'+(x.overdue?'逾期未採購':esc(x.verdict))+'</span></span></div>'
   +'<div class="item-row2">'+monthCells(x.mat)+'</div>'
   +'<div class="kv">'
     +'<div class="f"><span class="k">最近單價</span><span class="v mono hl">'+p2(x.lastPrice)+'</span></div>'
     +'<div class="f"><span class="k">單價區間</span><span class="v mono">'+priceRange+'</span></div>'
     +'<div class="f"><span class="k">平均單價</span><span class="v mono">'+p2(x.avgPrice)+'</span></div>'
     +'<div class="f"><span class="k">常見出貨量</span><span class="v mono">'+comboText(x.hist)+'</span></div>'
     +'<div class="f"><span class="k">採購次數</span><span class="v mono">'+n0(x.times)+'</span></div>'
     +'<div class="f"><span class="k">首購 / 末購</span><span class="v mono">'+val(x.first)+' → '+val(x.last)+'</span></div>'
     +'<div class="f"><span class="k">平均間隔(月)</span><span class="v mono">'+n1(x.avgGap)+'</span></div>'
     +'<div class="f"><span class="k">最短 / 最長間隔</span><span class="v mono">'+n0(x.minGap)+' / '+n0(x.maxGap)+'</span></div>'
     +'<div class="f"><span class="k">總數量</span><span class="v mono">'+n0(x.qty)+'</span></div>'
     +'<div class="f"><span class="k">月均用量</span><span class="v mono">'+n1(x.perMonth)+'</span></div>'
     +'<div class="f"><span class="k">平均每次量</span><span class="v mono">'+n1(x.perTime)+'</span></div>'
     +'<div class="f"><span class="k">總金額</span><span class="v mono">'+money(x.amt)+'</span></div>'
     +'<div class="f"><span class="k">距末購(月)</span><span class="v mono">'+n0(x.since)+'</span></div>'
     +'<div class="f"><span class="k">預估下次採購</span><span class="v mono">'+val(x.next)+'</span></div>'
   +'</div>'
   +(p&&PL[p.pl] ? '<p class="packnote">診所組牌價 <b>'+val(PL[p.pl].range)+'</b>'
        +(PL[p.pl].avg10?'　10+1 後 <b>'+p2(PL[p.pl].avg10)+'</b>':'')
        +(x.lastPrice&&PL[p.pl].hi?'　本客戶最近單價 <b>'+p2(x.lastPrice)+'</b>（牌價上限的 '
           +Math.round(x.lastPrice/PL[p.pl].hi*100)+'%）':'')+'</p>' : '')
   +(p ? '<p class="packnote">包裝 <b>'+val(p.pack)+'</b>　最小下單量 <b>'+val(p.moq)+'</b>　每盒 <b>'+val(p.perbox)+'</b>'
        +(p.nhiprice?'　健保價 <b>'+val(p.nhiprice)+'</b>':'')
        +(p.nearest?'　目前批次 <b>'+esc(p.nearest.batch)+'</b> 效期 <b>'+esc(p.nearest.exp)+'</b>（'+esc(p.st.label)+'）':'')
        +'</p>' : '')
   +'<div class="hist"><h5>歷次出貨（單價＝銷售額÷數量）</h5>'
   +'<div class="tscroll"><table class="rtable"><thead><tr><th>年月</th><th class="num">數量</th><th class="num">單價</th><th class="num">銷售額</th></tr></thead><tbody>'
   + x.hist.map(h=>'<tr><td class="mono lead">'+esc(h.ym)+'</td>'
      +'<td class="num mono" data-k="數量">'+n0(h.qty)+'</td>'
      +'<td class="num mono" data-k="單價">'+p2(h.price)+'</td>'
      +'<td class="num mono" data-k="銷售額">'+money(h.amt)+'</td></tr>').join('')
   +'</tbody></table></div></div>'
   +'</div>';
}
function custCard(c){
  const badge = c.nOverdue?'<span class="tag danger">'+c.nOverdue+' 項逾期</span>'
    : c.since>=3?'<span class="tag warn">'+n0(c.since)+' 個月沒進貨</span>'
    : '<span class="tag ok">採購中</span>';
  return '<article class="row" tabindex="0">'
   +'<div class="r-main"><div class="r-code">'+val(c.instCode||c.custCode)+(c.target?'<span class="tag accent sm">指定客戶</span>':'')+'</div>'
   +'<div class="r-name">'+esc(c.name)+'</div><div class="r-meta">'
   +(c.city?'<span>'+esc(c.city)+(c.dist?' '+esc(c.dist):'')+'</span>':'<span>經銷／公司戶</span>')
   +'<span>品項 <b class="mono">'+n0(c.items)+'</b></span>'
   +'<span>交易 <b class="mono">'+n0(c.deals)+'</b> 筆</span>'
   +'<span>採購 <b class="mono">'+n0(c.nmonths)+'</b> 個月</span>'
   +'<span>平均間隔 <b class="mono">'+n1(c.avgGap)+'</b> 月</span>'
   +(c.reps.length?'<span>業務 <b>'+c.reps.map(esc).join('、')+'</b></span>':'')
   +'</div></div>'
   +'<div class="r-right"><span class="exp">'+money(c.amt)+'</span>'+badge+'</div>'
   +'<div class="detail" data-cust="'+encodeURIComponent(c.name)+'"></div></article>';
}
function custDetail(c){
  return '<div class="dgrid">'
   +'<div class="f"><span class="k">醫事機構代號</span><span class="v mono">'+val(c.instCode)+'</span></div>'
   +'<div class="f"><span class="k">客戶代號</span><span class="v mono">'+val(c.custCode)+'</span></div>'
   +'<div class="f"><span class="k">客戶名稱（原始）</span><span class="v">'+val(c.custName)+'</span></div>'
   +'<div class="f"><span class="k">縣市 / 區別</span><span class="v">'+val(c.city)+(c.dist?' '+esc(c.dist):'')+'</span></div>'
   +'<div class="f"><span class="k">郵遞區號</span><span class="v mono">'+val(c.zip)+'</span></div>'
   +'<div class="f"><span class="k">特約類別</span><span class="v">'+val(c.ctype)+'</span></div>'
   +'<div class="f"><span class="k">部門代號</span><span class="v mono">'+(c.dept.length?c.dept.map(esc).join('、'):'—')+'</span></div>'
   +'<div class="f"><span class="k">業務員</span><span class="v">'+(c.reps.length?c.reps.map(esc).join('、'):'—')+'</span></div>'
   +'<div class="f"><span class="k">品項數 / 交易筆數</span><span class="v mono">'+n0(c.items)+' / '+n0(c.deals)+'</span></div>'
   +'<div class="f"><span class="k">採購月數</span><span class="v mono">'+n0(c.nmonths)+'</span></div>'
   +'<div class="f"><span class="k">平均間隔(月)</span><span class="v mono">'+n1(c.avgGap)+'</span></div>'
   +'<div class="f"><span class="k">總數量 / 總金額</span><span class="v mono">'+n0(c.qty)+' / '+money(c.amt)+'</span></div>'
   +'<div class="f"><span class="k">距末購(月)</span><span class="v mono">'+n0(c.since)+'</span></div>'
   +'<div class="f"><span class="k">採購月份</span><span class="v mono" style="font-size:12px">'+c.months.join('、')+'</span></div>'
   +'</div>'
   +'<div class="sect"><h4>品項用藥週期與歷史價格 <span style="letter-spacing:0">（格子＝'+MONTHS[0]+' 起每月，深色代表該月有進貨）</span></h4>'
   + c.cycles.map(itemBlock).join('') + '</div>';
}
function renderCust(){
  custReady=1;
  let rows=CUST.filter(c=>{
    const f = cActive==='all' || (cActive==='target'&&c.target) || (cActive==='overdue'&&c.nOverdue>0)
      || (cActive==='quiet'&&c.since>=3) || cActive==='top';
    return f && (!cQ||c.hay.includes(cQ));
  });
  const by={
    amt:(a,b)=>b.amt-a.amt, since:(a,b)=>b.since-a.since,
    overdue:(a,b)=>b.nOverdue-a.nOverdue||b.amt-a.amt,
    deals:(a,b)=>b.deals-a.deals, name:(a,b)=>a.name.localeCompare(b.name,'zh-Hant'),
  };
  rows.sort(by[cSort]);
  if(cActive==='top') rows=rows.slice(0,50);
  const shown=rows.slice(0,cShown);
  document.getElementById('c-cust').textContent = rows.length?'顯示 '+shown.length+' / '+rows.length+' 家客戶':'';
  document.getElementById('l-cust').innerHTML = rows.length?shown.map(custCard).join('')
    +(rows.length>cShown?'<button class="chipbtn" type="button" id="cust-more" style="margin-top:6px;justify-content:center">顯示更多（還有 '+(rows.length-cShown)+' 家）</button>':'')
    :'<div class="panel empty">找不到符合「'+esc(cQ)+'」的客戶。</div>';
}

/* ---------- 明細 ---------- */
let dQ='', dSel={city:'',dist:'',cat:'',ym:'',rep:''}, dShown=200, dRows=[];
const PAGE=200;
function initDet(){
  const box=document.getElementById('f-det');
  const uniq=k=>[...new Set(DET.map(d=>d[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'));
  [['city','全部縣市'],['dist','全部區別'],['cat','全部大類'],['ym','全部月份'],['rep','全部業務員']].forEach(([k,label])=>{
    const s=document.createElement('select'); s.id='sel-'+k;
    s.innerHTML='<option value="">'+label+'</option>'+uniq(k).map(v=>'<option>'+esc(v)+'</option>').join('');
    s.onchange=()=>{dSel[k]=s.value;dShown=PAGE;renderDet();};
    box.appendChild(s);
  });
  const r=document.createElement('button'); r.className='chipbtn'; r.type='button'; r.textContent='清除篩選';
  r.onclick=()=>{Object.keys(dSel).forEach(k=>{dSel[k]='';document.getElementById('sel-'+k).value='';});dShown=PAGE;renderDet();};
  box.appendChild(r);
  wireSearch('q-det',v=>{dQ=v;dShown=PAGE;renderDet();});
  document.getElementById('more').onclick=()=>{dShown+=PAGE;renderDet(true);};
}
function detRow(d){
  return '<tr>'
   +'<td class="lead">'+val(d.cust)+'</td>'
   +'<td class="lead" style="min-width:220px">'+val(d.item)+'</td>'
   +'<td class="mono" data-k="年月">'+val(d.ym)+'</td>'
   +'<td data-k="縣市">'+val(d.city)+'</td><td data-k="區別">'+val(d.dist)+'</td>'
   +'<td class="mono" data-k="機構代號">'+val(d.instCode)+'</td>'
   +'<td class="mono" data-k="品項代號">'+val(d.icode)+'</td>'
   +'<td class="mono" data-k="SAP">'+val(d.sap)+'</td>'
   +'<td data-k="大類">'+val(d.cat)+'</td>'
   +'<td class="num mono" data-k="數量">'+n0(d.qty)+'</td>'
   +'<td class="num mono" data-k="單價">'+p2(d.qty?Math.round(d.amt/d.qty*100)/100:null)+'</td>'
   +'<td class="num mono" data-k="銷售額">'+money(d.amt)+'</td>'
   +'<td data-k="業務員">'+val(d.rep)+'</td>'
   +'<td data-k="業績歸屬">'+val(d.attr)+'</td>'
   +'</tr>';
}
function renderDet(keepScroll){
  detReady=1;
  if(!keepScroll){
    dRows=DET.filter(d=>(!dQ||d.hay.includes(dQ)) && Object.entries(dSel).every(([k,v])=>!v||d[k]===v))
      .sort((a,b)=>a.ym.localeCompare(b.ym)||String(a.cust).localeCompare(String(b.cust),'zh-Hant'));
  }
  const q=dRows.reduce((s,d)=>s+d.qty,0), amt=dRows.reduce((s,d)=>s+d.amt,0);
  document.getElementById('t-det').innerHTML =
    '<span>筆數 <b>'+dRows.length.toLocaleString('en-US')+'</b></span><span>總數量 <b>'+n0(q)+'</b></span>'
    +'<span>總金額 <b>'+money(amt)+'</b></span><span>客戶 <b>'+new Set(dRows.map(d=>d.cust)).size+'</b> 家</span>'
    +'<span>品項 <b>'+new Set(dRows.map(d=>d.icode)).size+'</b> 項</span>';
  const page=dRows.slice(0,dShown);
  document.getElementById('l-det').innerHTML = page.length
    ? '<table class="rtable"><thead><tr><th>客戶</th><th>品項名稱</th><th>年月</th><th>縣市</th><th>區別</th><th>機構代號</th><th>品項代號</th><th>SAP</th><th>大類</th><th class="num">數量</th><th class="num">單價</th><th class="num">銷售額</th><th>業務員</th><th>業績歸屬</th></tr></thead><tbody>'
      + page.map(detRow).join('') + '</tbody></table>'
    : '<div class="empty">沒有符合條件的交易。</div>';
  const more=document.getElementById('more');
  more.hidden = dRows.length<=dShown;
  more.textContent = '再顯示 '+Math.min(PAGE,dRows.length-dShown)+' 筆（已顯示 '+page.length.toLocaleString('en-US')+' / '+dRows.length.toLocaleString('en-US')+'）';
}

/* ---------- 展開 ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='prod-more'){ pShown+=PAGE0; renderProd(); }
  if(e.target.id==='cust-more'){ cShown+=PAGE0; renderCust(); }
  if(e.target.id==='quote-more'){ qShown+=PAGE0; renderQuote(); }
});
function toggleRow(r){
  const d=r.querySelector('.detail[data-cust]');
  if(d && !d.dataset.built){ d.innerHTML = custDetail(CMAP[decodeURIComponent(d.dataset.cust)]); d.dataset.built='1'; }
  r.classList.toggle('open');
}
['l-prod','l-cust'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('click',e=>{const r=e.target.closest('.row'); if(r) toggleRow(r);});
  el.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();toggleRow(e.target);}
  });
});
</script>

</body>
</html>
