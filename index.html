<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<style>html{color-scheme:light dark}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>人人藥品效期查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#7b8c99;
  --line:#d8dfe4; --line-strong:#b9c5cd;
  --accent:#0f6e6e; --accent-soft:#dcecec;
  --ok:#2e7d4f; --ok-soft:#e2f0e8;
  --warn:#a35a00; --warn-soft:#faeddc;
  --danger:#b3261e; --danger-soft:#fae4e2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1417; --surface:#151f25; --surface-2:#1b262d;
    --ink:#e4ebef; --ink-2:#a3b3bd; --ink-3:#7a8b96;
    --line:#26343d; --line-strong:#3a4c57;
    --accent:#4fc0bb; --accent-soft:#16332f;
    --ok:#68c68c; --ok-soft:#14301f;
    --warn:#e0a95c; --warn-soft:#33270f;
    --danger:#f08a80; --danger-soft:#361714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1417; --surface:#151f25; --surface-2:#1b262d;
  --ink:#e4ebef; --ink-2:#a3b3bd; --ink-3:#7a8b96;
  --line:#26343d; --line-strong:#3a4c57;
  --accent:#4fc0bb; --accent-soft:#16332f;
  --ok:#68c68c; --ok-soft:#14301f;
  --warn:#e0a95c; --warn-soft:#33270f;
  --danger:#f08a80; --danger-soft:#361714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px;padding-block:28px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:18px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--ink-3);font-size:13px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.searchbar{position:sticky;top:0;z-index:20;padding-block:10px;background:var(--ground)}
.searchbox{display:flex;align-items:center;gap:10px;padding:10px 14px}
.searchbox svg{flex:none;color:var(--ink-3)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 17px/1.4 "IBM Plex Sans","Noto Sans TC",sans-serif;outline:none}
#q::placeholder{color:var(--ink-3);font-weight:400}
#clear{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
#clear:hover{background:var(--surface-2);color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.chipbtn:hover{border-color:var(--line-strong)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.chipbtn .n{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.75}
.chipbtn:focus-visible,#q:focus-visible,#clear:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.count{margin:18px 2px 8px;font-size:13px;color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:8px}

.row{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;display:grid;gap:4px 16px;cursor:pointer;
  grid-template-columns:1fr auto;align-items:start;
}
.row:hover{border-color:var(--line-strong)}
.row.open{border-color:var(--accent)}
.r-main{min-width:0}
.r-code{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.r-name{font-weight:600;font-size:15.5px;margin-top:1px;overflow-wrap:anywhere}
.r-meta{color:var(--ink-2);font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.r-meta b{font-weight:500;color:var(--ink)}
.r-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.exp{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;
  font-size:12px;font-weight:600;white-space:nowrap;
}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.none{background:var(--surface-2);color:var(--ink-3);font-weight:500}
.stripe{width:3px;border-radius:3px;align-self:stretch}

.detail{grid-column:1/-1;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:none}
.row.open .detail{display:block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.f{display:flex;flex-direction:column;gap:2px}
.f .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.f .v{font-size:14px}
.batches{margin-top:14px}
.batches h4{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3);line-height:1.7}
@media (max-width:560px){
  .row{grid-template-columns:1fr}
  .r-right{align-items:flex-start;text-align:left;flex-direction:row;align-items:center;gap:10px;margin-top:6px}
}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .12s ease}}
</style>
</head>

: "VACORT CREAM..   5GM (N)", "pack": "5GM / 支 (N)", "moq": 24, "perbox": 144, "nhi": "AC36181321", "nhiprice": "13.80", "crm": "13.80", "batches": [{"plant": "1102", "batch": "YD9787", "uom": "EA", "exp": "2030-04-16"}]}, {"code": "G4VG0", "name": "VGT 5P黴淨乳膏*", "en": "VAGENT CREAM..   5GM(N)", "pack": "5GM / 支 (P)", "moq": 144, "perbox": 144, "nhi": "A038511321", "nhiprice": "12.70", "crm": "12.70", "batches": []}];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
document.getElementById('today').textContent = TODAY.toISOString().slice(0,10);

const days = iso => Math.round((new Date(iso+'T00:00:00') - TODAY)/86400000);
function status(d){
  if(d===null) return {k:'none',label:'無效期資料',cls:'none'};
  if(d<0) return {k:'expired',label:'已過期',cls:'danger'};
  if(d<=180) return {k:'soon',label:'剩 '+d+' 天',cls:'danger'};
  if(d<=365) return {k:'year',label:'剩 '+Math.round(d/30)+' 個月',cls:'warn'};
  return {k:'ok',label:'剩 '+(d/365).toFixed(1)+' 年',cls:'ok'};
}
DATA.forEach(p=>{
  p.dmin = p.batches.length ? Math.min(...p.batches.map(b=>days(b.exp))) : null;
  p.st = status(p.dmin);
  p.hay = [p.code,p.name,p.en,p.nhi,p.pack,...p.batches.map(b=>b.batch)].filter(Boolean).join(' ').toLowerCase();
  p.nearest = p.batches.length ? p.batches.slice().sort((a,b)=>a.exp<b.exp?-1:1)[0] : null;
});

const FILTERS=[
  {k:'all',label:'全部'},
  {k:'expired',label:'已過期'},
  {k:'soon',label:'6 個月內到期'},
  {k:'year',label:'1 年內到期'},
  {k:'none',label:'無效期資料'},
];
let active='all', query='';

const fbox=document.getElementById('filters');
FILTERS.forEach(f=>{
  const n = f.k==='all' ? DATA.length : DATA.filter(p=>p.st.k===f.k).length;
  const b=document.createElement('button');
  b.className='chipbtn'; b.type='button'; b.id='f-'+f.k;
  b.setAttribute('aria-pressed', f.k===active);
  b.innerHTML = f.label + ' <span class="n">'+n+'</span>';
  b.onclick=()=>{active=f.k;[...fbox.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();};
  fbox.appendChild(b);
});

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = v => (v===null||v===undefined||v==='') ? '—' : esc(v);

function card(p){
  const b=p.nearest;
  return '<article class="row" tabindex="0" data-code="'+p.code+'">'
   +'<div class="r-main">'
     +'<div class="r-code">'+esc(p.code)+'</div>'
     +'<div class="r-name">'+esc(p.name||'—')+'</div>'
     +'<div class="r-meta">'
       +(p.pack?'<span>包裝 <b>'+esc(p.pack)+'</b></span>':'')
       +(p.moq?'<span>最小下單 <b class="mono">'+esc(p.moq)+'</b></span>':'')
       +(b?'<span>批次 <b class="mono">'+esc(b.batch)+'</b></span>':'')
     +'</div>'
   +'</div>'
   +'<div class="r-right">'
     +'<span class="exp">'+(b?esc(b.exp):'—')+'</span>'
     +'<span class="tag '+p.st.cls+'">'+esc(p.st.label)+'</span>'
   +'</div>'
   +'<div class="detail">'
     +'<div class="dgrid">'
       +'<div class="f"><span class="k">英文品名</span><span class="v">'+val(p.en)+'</span></div>'
       +'<div class="f"><span class="k">包裝說明</span><span class="v">'+val(p.pack)+'</span></div>'
       +'<div class="f"><span class="k">最小下單量</span><span class="v mono">'+val(p.moq)+'</span></div>'
       +'<div class="f"><span class="k">每盒數量</span><span class="v mono">'+val(p.perbox)+'</span></div>'
       +'<div class="f"><span class="k">健保碼</span><span class="v mono">'+val(p.nhi)+'</span></div>'
       +'<div class="f"><span class="k">健保價</span><span class="v mono">'+val(p.nhiprice)+'</span></div>'
       +'<div class="f"><span class="k">CRM 價</span><span class="v mono">'+val(p.crm)+'</span></div>'
     +'</div>'
     +(p.batches.length
        ? '<div class="batches"><h4>批次效期</h4><div class="tscroll"><table><thead><tr><th>批次</th><th>工廠</th><th>計量單位</th><th>保存期限</th><th>剩餘</th></tr></thead><tbody>'
          + p.batches.slice().sort((a,b)=>a.exp<b.exp?-1:1).map(x=>{
              const s=status(days(x.exp));
              return '<tr><td class="mono">'+esc(x.batch)+'</td><td class="mono">'+val(x.plant)+'</td><td>'+val(x.uom)+'</td><td class="mono">'+esc(x.exp)+'</td><td><span class="tag '+s.cls+'">'+esc(s.label)+'</span></td></tr>';
            }).join('')
          + '</tbody></table></div></div>'
        : '<div class="batches"><h4>批次效期</h4><p class="v" style="color:var(--ink-3);margin:0">效期表中沒有此料號。</p></div>')
   +'</div>'
   +'</article>';
}

function render(){
  const q=query.trim().toLowerCase();
  let rows=DATA.filter(p=>(active==='all'||p.st.k===active) && (!q||p.hay.includes(q)));
  rows.sort((a,b)=>{
    const av=a.dmin===null?1e9:a.dmin, bv=b.dmin===null?1e9:b.dmin;
    return av-bv || a.code.localeCompare(b.code);
  });
  document.getElementById('count').textContent = rows.length ? '顯示 '+rows.length+' 項，依效期由近到遠排序' : '';
  document.getElementById('list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="panel empty">找不到符合「'+esc(query)+'」的品項。試試 SAP 代號（例如 G4AF0）或部分品名。</div>';
}

const qi=document.getElementById('q'), cl=document.getElementById('clear');
qi.addEventListener('input',()=>{query=qi.value;cl.hidden=!query;render();});
cl.addEventListener('click',()=>{qi.value='';query='';cl.hidden=true;qi.focus();render();});
document.getElementById('list').addEventListener('click',e=>{
  const r=e.target.closest('.row'); if(r) r.classList.toggle('open');
});
document.getElementById('list').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();e.target.classList.toggle('open');}
});
render();
</script>
